<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kibu Teaser</title>
<style>
@font-face { font-family:'Pixelify Sans'; src:url('../dist/assets/fonts/PixelifySans.ttf') format('truetype'); font-weight:400 700; }
:root { --lime:#d4ff3a; --bg:#101112; --pixel:'Pixelify Sans',ui-monospace,monospace; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#050606; overflow:hidden; }
#viewport { position:fixed; inset:0; display:grid; place-items:center; }
#stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg); transform-origin:center; flex:none; }
#camera { position:absolute; inset:0; transform-origin:0 0; }
#yard { position:absolute; inset:0; background:radial-gradient(#ffffff17 1.4px,transparent 1.4px); background-size:44px 44px; background-position:22px 22px; }
#light { position:absolute; inset:0; }
.orbit { position:absolute; left:50%; top:52%; border:2px solid #d4ff3a0e; border-radius:50%; }
.orbit:before { content:""; position:absolute; width:10px; height:10px; border-radius:50%; background:#d4ff3a80; top:50%; left:-6px; margin-top:-5px; box-shadow:0 0 26px #d4ff3a66; }
.label { position:absolute; font:22px/1 var(--pixel); letter-spacing:4px; color:#a5af91; }
#pet { position:absolute; width:440px; height:411px; left:0; top:0; will-change:transform; }
#pet svg { display:block; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 28px 30px #0006); }
#shadow { position:absolute; width:230px; height:26px; border-radius:50%; background:#0009; filter:blur(12px); }
#bubble { position:absolute; left:0; top:0; background:var(--lime); color:#202914; font:28px/1.4 var(--pixel); padding:18px 30px; border-radius:24px 24px 24px 4px; white-space:nowrap; box-shadow:0 10px 40px #0004; transform-origin:50% 100%; }
#effects { position:absolute; inset:0; pointer-events:none; }
.particle { position:absolute; width:11px; height:11px; border-radius:2px; }
.heart { position:absolute; font:40px/1 -apple-system,sans-serif; width:auto; height:auto; background:none; }
#snack { position:absolute; display:grid; place-items:center; width:96px; height:114px; border:2px solid var(--lime); border-radius:10px; color:var(--lime); background:#242c1b; font:26px var(--mono); box-shadow:0 0 40px #d4ff3a33; }
#caption { position:absolute; left:120px; bottom:110px; font:96px/1 var(--pixel); color:#f3f4ef; letter-spacing:-2px; white-space:nowrap; }
#caption small { display:block; font:22px/1 var(--mono); color:#8c9780; letter-spacing:3px; margin-bottom:22px; }
#caption b { color:var(--lime); font-weight:inherit; }
#cursor { position:absolute; left:0; top:0; width:44px; height:62px; transform-origin:4px 4px; filter:drop-shadow(0 6px 10px #0007); }
#ripple { position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; border:3px solid var(--lime); border-radius:50%; opacity:0; }
#vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 50%,transparent 45%,#000a 100%); }
#flash { position:absolute; inset:0; background:var(--lime); opacity:0; mix-blend-mode:overlay; pointer-events:none; }
#dim { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; }
#endcard { position:absolute; inset:0; background:var(--bg); opacity:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background-image:radial-gradient(#ffffff10 1.4px,transparent 1.4px); background-size:44px 44px; }
#endface { width:230px; height:215px; margin-bottom:34px; }
#endface svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 20px 24px #0007); }
#wordmark { font:700 150px/1 var(--pixel); color:#f3f4ef; letter-spacing:-4px; }
#wordmark span { color:var(--lime); }
#headline { font:56px/1.2 var(--pixel); color:#f3f4ef; margin-top:40px; min-height:68px; white-space:pre; }
#soon { font:26px/1 var(--mono); color:var(--lime); letter-spacing:6px; margin-top:34px; }
#soon i { display:inline-block; width:18px; height:30px; background:var(--lime); vertical-align:-5px; margin-left:10px; }
#controls { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:10px; font:12px var(--mono); color:#888; align-items:center; }
#controls button { background:#1b201b; color:#ddd; border:1px solid #ffffff22; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
.capture #controls { display:none; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="camera">
      <div id="yard"></div>
      <div id="light"></div>
      <div class="orbit" id="orbit1"></div>
      <div class="orbit" id="orbit2"></div>
      <div class="label" id="eyebrow" style="left:120px;top:100px">OFF THE CLOCK</div>
      <div class="label" id="corner" style="right:-40px;bottom:250px;transform:rotate(90deg);font:20px var(--mono);letter-spacing:3px;color:#73816a">KIBU’S HAPPY PLACE</div>
      <div id="shadow"></div>
      <div id="pet"></div>
      <div id="bubble"></div>
      <div id="snack">.pdf</div>
      <div id="effects"></div>
      <div id="caption"></div>
    </div>
    <div id="ripple"></div>
    <svg id="cursor" viewBox="0 0 22 31"><path d="M2 2v23l6-5.6 3.8 9 3.8-1.6-3.8-8.8H20z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div id="dim"></div>
    <div id="flash"></div>
    <div id="endcard">
      <div id="endface"></div>
      <div id="wordmark">kibu<span>.</span></div>
      <div id="headline"></div>
      <div id="soon">COMING SOON TO YOUR DESKTOP<i></i></div>
    </div>
    <div id="vignette"></div>
  </div>
</div>
<div id="controls"><button id="play">Replay</button><span id="clock">0.0s</span></div>
<script type="module">
import { faceGrid } from '../dist/faces.js';

// ---------- constants shared with the site's character.js ----------
const ACCENTS = { love:'#ff6fa8', kiss:'#ff6fa8', sleepy:'#8fb4ff', thinking:'#8fb4ff', surprised:'#ffb23e', dizzy:'#ffb23e', starstruck:'#ffe066' };
const SPEEDS = { working:90, thinking:380, sleepy:900, music:420, celebrate:170, laugh:140, dizzy:260 };
const W = 1920, H = 1080, CX = 960, CY = 575, DURATION = 28;
// The cut starts mid-scene, cursor already on Kibu, so frame one has something going on.
const START = 4.2;
const HOOK = 'made a little guy.';

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const clamp = (n, a = 0, b = 1) => Math.max(a, Math.min(b, n));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function path(t, keys) { // keys: [time, x, y]; eased between points
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) {
    const [t1, x1, y1] = keys[i], [t0, x0, y0] = keys[i - 1];
    if (t <= t1) { const k = easeInOut(seg(t, t0, t1)); return [lerp(x0, x1, k), lerp(y0, y1, k)]; }
  }
  const last = keys[keys.length - 1]; return [last[1], last[2]];
}

// ---------- the same dot-matrix Kibu the site renders ----------
function makeFace(host, id) {
  let dots = '';
  for (let r = 0; r < 11; r++) for (let c = 0; c < 15; c++) dots += `<circle cx="${20.8 + c * 5.6}" cy="${24 + r * 5.6}" r="1.35" class="d"/>`;
  host.innerHTML = `<svg viewBox="0 0 120 112" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2a2b2f"/><stop offset=".5" stop-color="#141518"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient><linearGradient id="${id}r" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".38"/><stop offset=".35" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient><filter id="${id}b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g class="shell"><rect x="6" y="8" width="108" height="88" rx="34" fill="url(#${id}s)"/><rect x="6.5" y="8.5" width="107" height="87" rx="33.5" fill="none" stroke="url(#${id}r)"/><path d="M30 13.5Q60 9 90 13.5" stroke="#fff" stroke-opacity=".22" stroke-width="2" stroke-linecap="round" fill="none"/></g><g filter="url(#${id}b)">${dots}</g><circle class="led" cx="98" cy="22" r="1.8" fill="#d4ff3a"/></svg>`;
  const svg = host.firstChild, all = [...svg.querySelectorAll('.d')], led = svg.querySelector('.led'), shell = svg.querySelector('.shell');
  let lastKey = '';
  return {
    svg, led, shell, all,
    draw(mood, ms, look = { x:0, y:0 }, blinking = false, power = 1) {
      const grid = faceGrid(mood, Math.floor(ms / (SPEEDS[mood] || 350)), look, blinking);
      const accent = ACCENTS[mood] || '#d4ff3a';
      const key = mood + power.toFixed(2) + [...grid.entries()].flat().join();
      if (key === lastKey) return; lastKey = key;
      led.setAttribute('fill', accent);
      all.forEach((dot, i) => {
        const cell = grid.get(i), row = Math.floor(i / 15);
        const on = power >= 1 || row / 11 < power; // power-on scan, top to bottom
        dot.setAttribute('fill', cell === 'accent' ? accent : cell ? '#f3f4ef' : '#fff');
        dot.setAttribute('opacity', cell && on ? '1' : on ? '.07' : '0');
        dot.setAttribute('r', cell && on ? '2.05' : '1.35');
      });
    }
  };
}
const face = makeFace($('pet'), 'k');
const endFace = makeFace($('endface'), 'e');

// ---------- script ----------
// Moods and lines come straight from the site's playground.
const BEATS = [
  [0, 'idle', ''], [2.3, 'idle', 'oh good. you stayed.'],
  [4.45, 'love', 'my favorite human.'],
  [6.05, 'surprised', 'wheee.'], [7.75, 'dizzy', 'nice landing. mostly.'],
  [8.75, 'excited', 'a little byte?'], [10.0, 'happy', 'nom. zero crumbs.'],
  [11.2, 'music', 'tiny desk disco.'],
  [14.25, 'cool', 'too cool for busywork.'], [15.0, 'starstruck', 'you’re kind of a big deal.'],
  [15.75, 'laugh', 'you had to be there.'], [16.5, 'wink', 'between you and me…'],
  [17.6, 'thinking', 'hmm. wait.'], [18.8, 'working', 'shh. something’s cooking.'],
];
const HOPS = [4.45, 7.75, 10.0, 14.25, 15.0, 15.75, 16.5];
const BLINKS = [3.1, 5.3, 12.9, 19.6, 24.3, 26.1];
const BURSTS = [
  { t:4.45, n:10, hearts:true, color:'#ff6fa8', seed:1 },
  { t:10.0, n:16, color:'#d4ff3a', seed:2 },
  { t:11.3, n:18, color:'#d4ff3a', seed:3 }, { t:12.2, n:14, color:'#e1ff77', seed:4 }, { t:13.05, n:18, color:'#d4ff3a', seed:5 },
  { t:15.0, n:14, color:'#ffe066', seed:6 },
];
const CAPTIONS = [
  [3.0, 5.7, '01 — KIBU', HOOK],
  [5.8, 8.3, '02 — HANDS ON', 'drag me.'],
  [8.45, 11.0, '03 — SNACK TIME', 'feed me.'],
  [11.1, 14.0, '04 — DANCE BREAK', 'dance<b>.</b>'],
  [14.15, 17.3, '05 — SURPRISE ME', 'keep going.'],
];
// cursor: [time, x, y]
const CURSOR = [[3.0, 1500, 1120], [4.0, 1020, 600], [4.3, 1000, 590], [5.3, 1030, 610], [5.75, 990, 590], [6.9, 640, 470], [7.5, 760, 640], [8.05, 520, 820], [8.7, 360, 780], [9.6, 930, 600], [10.6, 1180, 700], [11.8, 1520, 1150]];
const CLICKS = [4.35, 5.8, 8.8];
const DRAG = [5.8, 7.55];
const SNACK = { spawn:8.2, grab:8.8, drop:9.6, eaten:9.95, from:[300, 760] };

function beatAt(t) { let b = BEATS[0], i = 0; BEATS.forEach((x, j) => { if (t >= x[0]) { b = x; i = j; } }); return [b, i]; }

// Kibu's position, including drag and the springy return
function petPos(t) {
  if (t >= DRAG[0] && t < DRAG[1]) { const [x, y] = path(t, CURSOR); return [x - 30, y + 15]; }
  if (t >= DRAG[1] && t < DRAG[1] + 1.1) {
    const [x, y] = path(DRAG[1], CURSOR), k = backOut(seg(t, DRAG[1] + .25, DRAG[1] + 1.05));
    return [lerp(x - 30, CX, k), lerp(y + 15, CY, k)];
  }
  return [CX, CY];
}
function hopOffset(t) {
  for (const h of HOPS) {
    const k = (t - h) / .62; if (k < 0 || k > 1) continue;
    if (k < .42) { const e = easeOut(k / .42); return { y:-52 * e, sx:1 - .03 * e, sy:1 + .04 * e }; }
    if (k < .82) { const e = easeIn((k - .42) / .4); return { y:-52 * (1 - e), sx:.97 + .11 * e, sy:1.04 - .12 * e }; }
    const e = easeOut((k - .82) / .18); return { y:0, sx:1.08 - .08 * e, sy:.92 + .08 * e };
  }
  return { y:0, sx:1, sy:1 };
}

// ---------- render(t) draws one frame, deterministically ----------
const particles = BURSTS.map(b => {
  const r = rng(b.seed);
  return Array.from({ length:b.n }, (_, i) => {
    const el = document.createElement('span'); el.className = b.hearts ? 'heart' : 'particle';
    if (b.hearts) { el.textContent = '♥'; el.style.color = b.color; } else el.style.background = b.color;
    $('effects').append(el);
    const a = Math.PI * 2 * i / b.n - Math.PI / 2;
    return { el, b, a, d:90 + r() * 170, rot:r() * 150, dur:.7 + r() * .45 };
  });
}).flat();

const bubble = $('bubble'), pet = $('pet');
let lastText = null;
function draw(t) {
  $('clock').textContent = t.toFixed(1) + 's';
  const [beat, beatIndex] = beatAt(t);
  const [cx, cy] = path(t, CURSOR);

  // camera: start tight on the face, pull out; zoom into the face at the end
  let cam = lerp(1.9, 1, easeInOut(seg(t, 1.2, 3.4)));
  const [px, py] = petPos(t);
  let focusX = lerp(px, CX, easeInOut(seg(t, 1.2, 3.4))), focusY = lerp(py, CY, easeInOut(seg(t, 1.2, 3.4)));
  if (t > 19.8) { cam = lerp(1, 11, easeIn(seg(t, 19.8, 21.4))); focusX = px; focusY = py - 10; }
  const drift = Math.sin(t * .6) * 6; // gentle handheld float
  $('camera').style.transform = `translate(${CX - focusX * cam + drift}px,${CY - focusY * cam}px) scale(${cam})`;

  // yard ambience
  const dancing = t >= 11.2 && t < 14.1;
  const spin = t * 8 + (dancing ? Math.pow(seg(t, 11.2, 14.1), 1) * 520 : t >= 14.1 ? 520 : 0);
  [['orbit1', 760, spin], ['orbit2', 1180, -spin * .7]].forEach(([id, s, r]) => {
    const o = $(id); o.style.width = o.style.height = s + 'px';
    o.style.transform = `translate(-50%,-50%) rotate(${r}deg)`;
    o.style.borderColor = dancing ? '#d4ff3a44' : '#d4ff3a10';
  });
  $('light').style.background = `radial-gradient(circle 520px at ${lerp(CX, cx, seg(t, 3, 4))}px ${lerp(CY, cy, seg(t, 3, 4))}px,#d4ff3a${dancing ? '1c' : '10'},transparent 70%)`;
  const chrome = seg(t, 2.8, 3.6) * (1 - seg(t, 17.2, 18.2));
  $('eyebrow').style.opacity = $('corner').style.opacity = chrome;
  $('yard').style.opacity = seg(t, 1.0, 2.6);

  // Kibu body
  const hop = hopOffset(t);
  const breathe = -18 * (1 - Math.cos(t * Math.PI / 2)) / 2;
  let rot = 2 * (1 - Math.cos(t * Math.PI / 2)) / 2, dy = breathe + hop.y;
  if (dancing) { const k = (t - 11.2) / .85 * Math.PI * 2; rot = Math.sin(k) * 10; dy = -Math.abs(Math.sin(k)) * 46; }
  const dragging = t >= DRAG[0] + .2 && t < DRAG[1];
  if (dragging) { const [vx] = path(t + .05, CURSOR), [ux] = path(t - .05, CURSOR); rot = clamp((vx - ux) / 4, -16, 16); dy = 0; }
  const appear = easeOut(seg(t, .9, 2.0));
  pet.style.transform = `translate(${px - 220}px,${py - 205 + dy}px) rotate(${rot}deg) scale(${hop.sx * lerp(.9, 1, appear)},${hop.sy * lerp(.9, 1, appear)})`;
  face.shell.style.opacity = appear;
  face.led.style.opacity = t < .9 ? (Math.sin(t * 9) > 0 ? 1 : .25) * seg(t, .15, .3) : 1;
  pet.style.opacity = t < .15 ? 0 : 1;
  $('shadow').style.transform = `translate(${px - 115}px,${CY + 200}px) scale(${1 + dy / 120})`;
  $('shadow').style.opacity = dragging ? 0 : appear * .9;

  // face: power-on scan, blinks, eyes follow the cursor
  const blinking = BLINKS.some(b => t >= b && t < b + .14);
  const look = { x:clamp((cx - px) / 300, -1, 1), y:clamp((cy - py) / 280, -1, 1) };
  face.draw(beat[1], t * 1000, t > 3 && t < 12 ? look : { x:0, y:0 }, blinking, seg(t, 1.3, 2.1) + (t > 2.1 ? 1 : 0));
  face.svg.style.filter = beat[1] === 'working' ? 'drop-shadow(0 0 40px #d4ff3a55) drop-shadow(0 28px 30px #0006)' : '';

  // speech bubble, pops on every new line
  const text = t > 19.9 ? '' : beat[2];
  if (text !== lastText) { bubble.textContent = text; lastText = text; }
  const pop = backOut(seg(t, beat[0], beat[0] + .28));
  bubble.style.opacity = text ? 1 : 0;
  bubble.style.background = dancing ? '#e1ff77' : beat[1] === 'thinking' ? '#b4caff' : '#d4ff3a';
  bubble.style.transform = `translate(${px}px,${py - 190 + dy * .6}px) translate(-50%,-100%) scale(${lerp(.55, 1, pop)})`;

  // particles
  for (const p of particles) {
    const k = (t - p.b.t) / p.dur;
    if (k < 0 || k > 1) { p.el.style.opacity = 0; continue; }
    const [bx, by] = petPos(p.b.t), e = easeOut(k);
    p.el.style.opacity = 1 - k;
    p.el.style.transform = `translate(${bx + Math.cos(p.a) * p.d * e}px,${by - 40 + (Math.sin(p.a) * p.d - 60) * e}px) rotate(${p.rot * e}deg) scale(${lerp(.6, 0, k) + (1 - k) * .6})`;
  }

  // file snack: appears, cursor carries it, Kibu eats it
  const snack = $('snack');
  if (t < SNACK.spawn || t > SNACK.eaten) snack.style.opacity = 0;
  else {
    let [sx, sy] = SNACK.from, scale = backOut(seg(t, SNACK.spawn, SNACK.spawn + .35)), sr = -14;
    if (t >= SNACK.grab && t < SNACK.drop) { [sx, sy] = path(t, CURSOR); sx -= 20; sy -= 30; sr = -8 + Math.sin(t * 12) * 5; }
    if (t >= SNACK.drop) { const k = easeIn(seg(t, SNACK.drop, SNACK.eaten)); const [dx0, dy0] = path(SNACK.drop, CURSOR); sx = lerp(dx0 - 20, px, k); sy = lerp(dy0 - 30, py - 20, k); scale = 1 - .9 * k; sr = 28 * k; }
    snack.style.opacity = 1;
    snack.style.transform = `translate(${sx - 48}px,${sy - 57}px) rotate(${sr}deg) scale(${scale})`;
  }

  // captions
  const cap = CAPTIONS.find(c => t >= c[0] && t < c[1]);
  const capEl = $('caption');
  if (cap) {
    const inK = easeOut(seg(t, cap[0], cap[0] + .35)), outK = seg(t, cap[1] - .25, cap[1]);
    capEl.innerHTML = `<small>${cap[2]}</small>${cap[3]}`;
    capEl.style.opacity = inK * (1 - outK);
    capEl.style.transform = `translateY(${(1 - inK) * 30 - outK * 20}px)`;
  } else capEl.style.opacity = 0;

  // cursor + click ripples
  const cursorOn = seg(t, 3.0, 3.3) * (1 - seg(t, 11.3, 11.8));
  const pressed = CLICKS.some(c => t >= c && t < c + .14) || (t >= DRAG[0] && t < DRAG[1]) || (t >= SNACK.grab && t < SNACK.drop);
  $('cursor').style.opacity = cursorOn;
  // cursor lives outside the camera, so project it
  $('cursor').style.transform = `translate(${CX - focusX * cam + drift + cx * cam - 4}px,${CY - focusY * cam + cy * cam - 4}px) scale(${pressed ? .86 : 1})`;
  const click = [...CLICKS, DRAG[1], SNACK.drop].find(c => t >= c && t < c + .5);
  const ripple = $('ripple');
  if (click !== undefined) {
    const k = seg(t, click, click + .5), [rx, ry] = path(click, CURSOR);
    ripple.style.opacity = 1 - k;
    ripple.style.transform = `translate(${CX - focusX * cam + drift + rx * cam}px,${CY - focusY * cam + ry * cam}px) scale(${.3 + k})`;
  } else ripple.style.opacity = 0;

  // punchy flashes on dance beats and surprise cuts
  let flash = 0;
  if (dancing) flash = Math.max(0, 1 - ((t - 11.2) % .85) / .2) * .22;
  for (const b of [14.25, 15.0, 15.75, 16.5]) if (t >= b && t < b + .18) flash = .35 * (1 - (t - b) / .18);
  $('flash').style.opacity = flash;

  // mood lighting as it gets "secret"
  $('dim').style.opacity = lerp(0, .35, seg(t, 17.4, 18.6)) + seg(t, 20.8, 21.5) * .65;

  // end card
  const endIn = seg(t, 21.4, 22.0);
  $('endcard').style.opacity = endIn * (1 - seg(t, DURATION - .6, DURATION));
  if (t > 21.3) {
    const k = easeOut(seg(t, 21.6, 22.4));
    $('endface').style.transform = `translateY(${(1 - k) * 40 - 12 * (1 - Math.cos(t * Math.PI / 2)) / 2}px)`;
    $('endface').style.opacity = k;
    const endMood = t < 24.3 ? 'working' : t < 25.3 ? 'wink' : 'happy';
    endFace.draw(endMood, t * 1000, { x:0, y:0 }, BLINKS.some(b => t >= b && t < b + .14));
    const wk = easeOut(seg(t, 22.1, 22.7));
    $('wordmark').style.opacity = wk; $('wordmark').style.transform = `translateY(${(1 - wk) * 30}px)`;
    const line = 'something amazing is cooking.';
    const n = Math.floor(seg(t, 23.0, 24.6) * line.length);
    $('headline').textContent = line.slice(0, n) + (t < 25 && Math.floor(t * 3) % 2 ? '▌' : ' ');
    $('soon').style.opacity = seg(t, 25.0, 25.5);
    $('soon').querySelector('i').style.opacity = Math.floor(t * 2.4) % 2 ? 1 : 0;
  }
};
window.render = t => draw(t + START);
window.DURATION = DURATION - START;

// ---------- live playback (not used while capturing) ----------
const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); $('stage').style.transform = `scale(${s})`; };
addEventListener('resize', fit); fit();
if (!location.search.includes('capture')) {
  let start = performance.now();
  $('play').onclick = () => start = performance.now();
  const loop = now => { window.render(Math.min((now - start) / 1000, window.DURATION)); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
} else { document.documentElement.classList.add('capture'); window.render(0); }
</script>
</body>
</html>
